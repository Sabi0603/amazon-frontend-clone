<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg19" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f8fafc"/></radialGradient>
    <radialGradient id="sh19" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(15,23,42,0.3)"/><stop offset="60%" stop-color="rgba(15,23,42,0.08)"/><stop offset="100%" stop-color="rgba(15,23,42,0)"/></radialGradient>
    <linearGradient id="body19" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#064e3b"/><stop offset="50%" stop-color="#047857"/><stop offset="100%" stop-color="#065f46"/></linearGradient>
    <pattern id="mesh19" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#047857"/>
      <circle cx="4" cy="4" r="2.5" fill="#064e3b"/>
      <circle cx="0" cy="0" r="1.5" fill="#10b981"/>
      <circle cx="8" cy="8" r="1.5" fill="#10b981"/>
    </pattern>
    <linearGradient id="rubber19" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg19)"/>
  <ellipse cx="300" cy="470" rx="170" ry="24" fill="url(#sh19)"/>
  <!-- Carry Loop Rope -->
  <path d="M 170 300 C 120 290 120 230 170 220" fill="none" stroke="url(#rubber19)" stroke-width="12" stroke-linecap="round"/>
