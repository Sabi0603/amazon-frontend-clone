  <path d="M 440 240 C 440 218 422 200 400 200 L 380 200" fill="none" stroke="url(#rubber19)" stroke-width="8"/>
  <path d="M 160 360 C 160 382 178 400 200 400 L 220 400" fill="none" stroke="url(#rubber19)" stroke-width="8"/>
  <path d="M 440 360 C 440 382 422 400 400 400 L 380 400" fill="none" stroke="url(#rubber19)" stroke-width="8"/>
  <!-- Embossed Bold Logo -->
  <rect x="230" y="265" width="140" height="70" rx="12" fill="url(#rubber19)"/>
  <text x="300" y="318" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="3">JBL</text>
  <!-- Top Controls -->
  <circle cx="260" cy="188" r="8" fill="url(#rubber19)"/>
  <circle cx="300" cy="188" r="8" fill="url(#rubber19)"/>
  <circle cx="340" cy="188" r="8" fill="url(#rubber19)"/>
