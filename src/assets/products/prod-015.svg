    <radialGradient id="dal15" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#facc15"/><stop offset="70%" stop-color="#eab308"/><stop offset="100%" stop-color="#ca8a04"/></radialGradient>
